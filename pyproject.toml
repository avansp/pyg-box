[project]
name = "pyg-box"
version = "0.1"
description = "A sandbox for the PyTorch Geometric model and dataset testing."
authors = [
    {name="Avan Suinesiaputra", email="avan.sp@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/avansp/template-hydra-lightning"
Issues = "https://github.com/avansp/template-hydra-lightning/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
train = "modules.train:train"
